<body>
  <a class="skip-link" href="#desktop-files">К папкам портфолио</a>
  <header class="menu-bar" aria-label="Меню рабочего стола">
    <div class="menu-left">
      <button class="brand-button menu-trigger" data-menu="brand" aria-label="Меню prettyraven" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 1 2.9 7.8L23 12l-8.1 3.1L12 23l-3-7.9L1 12l8-3.2Z" fill="currentColor"/></svg></button>
      <button class="app-name" data-open="welcome">prettyraven</button>
      <button class="menu-trigger desktop-menu" data-menu="file" aria-expanded="false">Файл</button>
      <button class="menu-trigger desktop-menu" data-menu="view" aria-expanded="false">Вид</button>
      <button class="menu-trigger desktop-menu" data-menu="window" aria-expanded="false">Окно</button>
    </div>
    <div class="menu-right">
      <button class="availability" data-open="contact"><i></i><span>Открыт к предложениям</span></button>
      <button class="bar-icon" id="spotlight-trigger" aria-label="Поиск по портфолио"></button>
      <button class="bar-icon" data-open="settings" id="controls-trigger" aria-label="Настройки рабочего стола"></button>
      <time id="menu-clock"></time>
    </div>
  </header>

  <main id="desktop" aria-label="Рабочий стол prettyraven">
    <div class="wallpaper" aria-hidden="true"></div>
    <div class="wallpaper-grain" aria-hidden="true"></div>
    <div class="desktop-signature" aria-hidden="true"><span>GRAPHIC DESIGNER’S WORKSPACE</span><strong class="desktop-wordmark"><img src="./assets/prettyraven-wordmark.svg" alt="" width="39112" height="7961"></strong><div>МОСКВА · DESIGN / MUSIC / CULTURE<span>DESKTOP EDITION — 02</span></div></div>
    <div class="mobile-intro"><span class="micro-label">ЛИЧНОЕ ПРОСТРАНСТВО ДИЗАЙНЕРА</span><h1>Виталий Богданенко</h1><p>Постеры, обложки, принты и digital.</p><button class="primary-button" data-nav="gallery">Открыть галерею <span>↗</span></button></div>
    <nav class="desktop-files" id="desktop-files" aria-label="Папки и файлы портфолио"></nav>
    <button class="loose-file" data-preview="f1-vettel" aria-label="Открыть постер Vettel"><span class="loose-photo"><img src="./assets/thumbs/f1-vettel.webp" alt="Постер Себастьяна Феттеля" width="150" height="160"></span><span>Vettel_final.webp</span></button>
    <div class="desktop-hint"><span class="hint-dot"></span><span>Открывай папки. Здесь всё работает.</span></div>
    <div id="window-layer"></div>
  </main>

  <nav class="dock" aria-label="Dock — приложения портфолио" id="dock"></nav>
  <div class="popup-menu" id="popup-menu" hidden></div>
  <div class="spotlight-overlay" id="spotlight" hidden>
    <section class="spotlight-panel" role="dialog" aria-modal="true" aria-label="Поиск по портфолио">
      <div class="spotlight-input"><span id="spotlight-icon"></span><input id="spotlight-input" type="search" placeholder="Найти работу, папку или резюме…" autocomplete="off" aria-label="Поиск по портфолио"><button id="spotlight-close" aria-label="Закрыть поиск">esc</button></div>
      <div class="spotlight-results" id="spotlight-results"></div>
      <footer><span>Портфолио под рукой</span><span>↑ ↓ выбор &nbsp; ↵ открыть</span></footer>
    </section>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <noscript><div class="no-script">Для интерактивного рабочего стола нужен JavaScript. <a href="./assets/vitaliy-bogdanenko-resume-2026.pdf">Открыть резюме</a> или <a href="mailto:prettyraven22@yandex.ru">написать дизайнеру</a>.</div></noscript>

</html>
